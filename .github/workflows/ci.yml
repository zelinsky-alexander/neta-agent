name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ clang libbpf-dev libssl-dev libsqlite3-dev sqlite3 iproute2 curl openssl
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: MS3.5 native acceptance harness syntax
        run: bash -n tests/ms3_native_linux_acceptance.sh
      - name: MS3.5 native acceptance preflight
        run: bash tests/ms3_native_linux_acceptance.sh ./build/neta-agent --preflight-only
      - name: Configure without eBPF
        run: cmake -S . -B build-no-ebpf -G Ninja -DCMAKE_BUILD_TYPE=Debug -DNETA_EBPF=OFF
      - name: Build without eBPF
        run: cmake --build build-no-ebpf
      - name: Test without eBPF
        run: ctest --test-dir build-no-ebpf --output-on-failure
      - name: MS0 controlled TLS/netem acceptance
        run: bash tests/ms0_acceptance.sh ./build/neta-agent
      - name: CLI capability smoke
        run: ./build/neta-agent capabilities
      - name: SQLite on-demand creation smoke
        run: ./build/neta-agent storage status --db "$RUNNER_TEMP/neta-smoke.db" --max-db-mb 1

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Windows dependencies
        shell: pwsh
        run: |
          vcpkg install openssl:x64-windows sqlite3:x64-windows
      - name: Configure Windows x64
        shell: pwsh
        run: |
          cmake -S . -B build-windows -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DNETA_EBPF=OFF
      - name: Build Windows x64
        shell: pwsh
        run: cmake --build build-windows --config Debug
      - name: Test Windows platform foundation
        shell: pwsh
        run: ctest --test-dir build-windows -C Debug --output-on-failure
      - name: Windows capabilities smoke
        shell: pwsh
        run: .\build-windows\Debug\neta-agent.exe capabilities
      - name: Windows NAP/1 CLI smoke
        shell: pwsh
        run: |
          $output = & .\build-windows\Debug\neta-agent.exe fleet status --state-dir "$env:RUNNER_TEMP\missing-neta-identity" 2>&1 | Out-String
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 1) { throw "expected fleet status on missing identity to exit 1, got $exitCode" }
          if ($output -notmatch 'cannot open .*identity\.conf') { throw "expected missing identity.conf error, got: $output" }
          Write-Host "Expected missing-identity failure observed: exit=$exitCode"
