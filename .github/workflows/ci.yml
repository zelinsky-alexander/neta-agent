name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ clang libbpf-dev libssl-dev libsqlite3-dev sqlite3 iproute2 curl openssl
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: MS3.5 native acceptance harness syntax
        run: bash -n tests/ms3_native_linux_acceptance.sh
      - name: MS3.5 native acceptance preflight
        run: bash tests/ms3_native_linux_acceptance.sh ./build/neta-agent --preflight-only
      - name: Configure without eBPF
        run: cmake -S . -B build-no-ebpf -G Ninja -DCMAKE_BUILD_TYPE=Debug -DNETA_EBPF=OFF
      - name: Build without eBPF
        run: cmake --build build-no-ebpf
      - name: Test without eBPF
        run: ctest --test-dir build-no-ebpf --output-on-failure
      - name: MS0 controlled TLS/netem acceptance
        run: bash tests/ms0_acceptance.sh ./build/neta-agent
      - name: CLI capability smoke
        run: ./build/neta-agent capabilities
      - name: SQLite on-demand creation smoke
        run: ./build/neta-agent storage status --db "$RUNNER_TEMP/neta-smoke.db" --max-db-mb 1

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Windows dependencies
        shell: pwsh
        run: |
          vcpkg install openssl:x64-windows sqlite3:x64-windows
      - name: Configure Windows x64
        shell: pwsh
        run: |
          cmake -S . -B build-windows -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DNETA_EBPF=OFF
      - name: Build Windows x64
        shell: pwsh
        run: cmake --build build-windows --config Debug
      - name: Test Windows platform foundation
        shell: pwsh
        run: ctest --test-dir build-windows -C Debug --output-on-failure
      - name: Windows capabilities smoke
        shell: pwsh
        run: .\build-windows\Debug\neta-agent.exe capabilities
      - name: Windows NAP/1 CLI smoke
        shell: pwsh
        run: |
          $output = & .\build-windows\Debug\neta-agent.exe fleet status --state-dir "$env:RUNNER_TEMP\missing-neta-identity" 2>&1 | Out-String
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 1) { throw "expected fleet status on missing identity to exit 1, got $exitCode" }
          if ($output -notmatch 'cannot open .*identity\.conf') { throw "expected missing identity.conf error, got: $output" }
          Write-Host "Expected missing-identity failure observed: exit=$exitCode"
          exit 0
      - name: Windows service SCM smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $serviceName = 'NETAAgent'
          $exe = (Resolve-Path '.\build-windows\Debug\neta-agent.exe').Path
          $db = Join-Path $env:RUNNER_TEMP 'neta-service-smoke.db'
          $stateDir = Join-Path $env:RUNNER_TEMP 'neta-service-state'
          New-Item -ItemType Directory -Force -Path $stateDir | Out-Null
          $binaryPath = "`"$exe`" service --all --db `"$db`" --state-dir `"$stateDir`" --max-db-mb 1"
          sc.exe delete $serviceName 2>$null | Out-Null
          sc.exe create $serviceName binPath= $binaryPath start= demand | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "sc.exe create failed with exit $LASTEXITCODE" }
          try {
            sc.exe start $serviceName | Write-Host
            if ($LASTEXITCODE -ne 0) { throw "sc.exe start failed with exit $LASTEXITCODE" }
            $deadline = (Get-Date).AddSeconds(20)
            do {
              Start-Sleep -Milliseconds 500
              $service = Get-Service -Name $serviceName
            } while ($service.Status -ne 'Running' -and (Get-Date) -lt $deadline)
            if ($service.Status -ne 'Running') { throw "NETAAgent did not reach Running state; current=$($service.Status)" }
            Start-Sleep -Seconds 2
            if (-not (Test-Path $db)) { throw "NETAAgent service did not create its configured database" }
            sc.exe stop $serviceName | Write-Host
            if ($LASTEXITCODE -ne 0) { throw "sc.exe stop failed with exit $LASTEXITCODE" }
            $deadline = (Get-Date).AddSeconds(20)
            do {
              Start-Sleep -Milliseconds 500
              $service = Get-Service -Name $serviceName
            } while ($service.Status -ne 'Stopped' -and (Get-Date) -lt $deadline)
            if ($service.Status -ne 'Stopped') { throw "NETAAgent did not stop cleanly; current=$($service.Status)" }
          } finally {
            sc.exe stop $serviceName 2>$null | Out-Null
            sc.exe delete $serviceName | Out-Null
          }
