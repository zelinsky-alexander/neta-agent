name: Windows AMD64 Release Package

on:
  workflow_dispatch:
  push:
    branches:
      - windows-service-foundation
    paths:
      - '.github/workflows/windows-release-amd64.yml'
      - 'CMakeLists.txt'
      - 'include/**'
      - 'src/**'
      - 'tests/windows_platform_test.cpp'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'

permissions:
  contents: read

jobs:
  package-windows-amd64:
    name: Windows AMD64 Release
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Windows dependencies
        shell: pwsh
        run: vcpkg install openssl:x64-windows sqlite3:x64-windows

      - name: Configure Release x64
        shell: pwsh
        run: cmake -S . -B build-windows-release -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_APPLOCAL_DEPS=ON -DNETA_EBPF=OFF

      - name: Build Release x64
        shell: pwsh
        run: cmake --build build-windows-release --config Release --parallel

      - name: Test Release x64
        shell: pwsh
        run: ctest --test-dir build-windows-release -C Release --output-on-failure

      - name: Capabilities smoke
        shell: pwsh
        run: .\build-windows-release\Release\neta-agent.exe capabilities

      - name: Windows service SCM Release smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $serviceName = 'NETAAgent'
          $exe = (Resolve-Path '.\build-windows-release\Release\neta-agent.exe').Path
          $db = Join-Path $env:RUNNER_TEMP 'neta-release-service-smoke.db'
          $stateDir = Join-Path $env:RUNNER_TEMP 'neta-release-service-state'
          New-Item -ItemType Directory -Force -Path $stateDir | Out-Null
          $binaryPath = "`"$exe`" service --all --db `"$db`" --state-dir `"$stateDir`" --max-db-mb 1"
          sc.exe delete $serviceName 2>$null | Out-Null
          sc.exe create $serviceName binPath= $binaryPath start= demand | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "sc.exe create failed with exit $LASTEXITCODE" }
          try {
            sc.exe start $serviceName | Write-Host
            if ($LASTEXITCODE -ne 0) { throw "sc.exe start failed with exit $LASTEXITCODE" }
            $deadline = (Get-Date).AddSeconds(20)
            do {
              Start-Sleep -Milliseconds 500
              $service = Get-Service -Name $serviceName
            } while ($service.Status -ne 'Running' -and (Get-Date) -lt $deadline)
            if ($service.Status -ne 'Running') { throw "NETA release service did not reach Running state; current=$($service.Status)" }
            Start-Sleep -Seconds 2
            if (-not (Test-Path $db)) { throw "NETA release service did not create its configured database" }
            sc.exe stop $serviceName | Write-Host
            if ($LASTEXITCODE -ne 0) { throw "sc.exe stop failed with exit $LASTEXITCODE" }
            $deadline = (Get-Date).AddSeconds(20)
            do {
              Start-Sleep -Milliseconds 500
              $service = Get-Service -Name $serviceName
            } while ($service.Status -ne 'Stopped' -and (Get-Date) -lt $deadline)
            if ($service.Status -ne 'Stopped') { throw "NETA release service did not stop cleanly; current=$($service.Status)" }
          } finally {
            sc.exe stop $serviceName 2>$null | Out-Null
            sc.exe delete $serviceName | Out-Null
          }

      - name: Package Windows AMD64 Release
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $packageName = "neta-agent-windows-amd64-$shortSha"
          $stage = Join-Path $PWD "dist\$packageName"
          $releaseDir = Join-Path $PWD 'build-windows-release\Release'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item (Join-Path $releaseDir 'neta-agent.exe') $stage -Force
          Get-ChildItem -Path $releaseDir -Filter '*.dll' -File -ErrorAction SilentlyContinue | Copy-Item -Destination $stage -Force
          if (Test-Path '.\LICENSE') { Copy-Item '.\LICENSE' $stage -Force }
          if (Test-Path '.\THIRD_PARTY_NOTICES.md') { Copy-Item '.\THIRD_PARTY_NOTICES.md' $stage -Force }
          @"
          NETA Agent Windows AMD64 Release
          =================================
          Commit: $env:GITHUB_SHA
          Workflow run: $env:GITHUB_RUN_ID
          Architecture: AMD64 / x64
          Target: Windows 10 22H2+ and Windows 11 x64

          Install the files into C:\Program Files\NETA and keep persistent
          state under C:\ProgramData\NETA. Enroll each Windows machine as a
          distinct fleet identity before starting the NETAAgent service.
          "@ | Set-Content -Path (Join-Path $stage 'BUILD_INFO.txt') -Encoding utf8
          $runtimeFiles = Get-ChildItem -Path $stage -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | Sort-Object Name
          $runtimeFiles | ForEach-Object { $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(); "$hash  $($_.Name)" } | Set-Content -Path (Join-Path $stage 'SHA256SUMS.txt') -Encoding ascii
          $zip = Join-Path $PWD "dist\$packageName.zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal -Force
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$zipHash  $packageName.zip" | Set-Content -Path "$zip.sha256" -Encoding ascii
          "package_name=$packageName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "zip_path=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "checksum_path=$zip.sha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Package: $zip"
          Write-Host "SHA256: $zipHash"
          Get-ChildItem $stage | Format-Table Name,Length

      - name: Upload Windows AMD64 package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.package_name }}
          path: |
            ${{ steps.package.outputs.zip_path }}
            ${{ steps.package.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: 30
