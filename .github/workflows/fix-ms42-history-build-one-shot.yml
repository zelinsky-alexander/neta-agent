name: Fix MS4.2 history build one-shot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-ms42-history-build-one-shot.yml

permissions:
  contents: write

jobs:
  patch-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fix history renderer build
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/main.cpp')
          text = path.read_text()

          old = '''                      << "\\\",\\\"tls_session_count\\\":" << tls_sessions.size() << '}\\n';'''
          new = '''                      << "\\\",\\\"tls_session_count\\\":" << tls_sessions.size() << "}\\n";'''
          if old not in text:
              raise SystemExit('tls_session_count terminator not found')
          text = text.replace(old, new, 1)

          old = '''                          << "\\n    Evidence SHA-256: " << evidence.sha256 << '\\n';'''
          new = '''                          << "\\n    Evidence SHA-256: " << tls_session_evidence_hash(evidence) << '\\n';'''
          if old not in text:
              raise SystemExit('invalid TlsSessionEvidence sha256 access not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/fix-ms42-history-build-one-shot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.cpp
          git commit -m "Fix MS4.2 history TLS renderer build"
          git push origin HEAD:main
